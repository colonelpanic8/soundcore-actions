name: Release App Artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to build and publish (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate release version
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('version.json'))
          assert os.environ['RELEASE_TAG'] == 'v' + version['versionName'], 'Tag and version.json disagree'
          PY
      - uses: actions/cache@v4
        with:
          path: |
            build/direct-patch/original-merged.apk
            build/tools/
          key: soundcore-input-${{ hashFiles('upstream.json', 'direct-patch/build.py') }}
      - name: Fetch verified upstream input
        run: python scripts/fetch-input.py
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'soundcore-signing.keystore'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - name: Build and verify signed APK
        env:
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: python direct-patch/build.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" --keystore "$RUNNER_TEMP/soundcore-signing.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: soundcore-actions-android
          path: |
            build/release/soundcore-actions-signed.apk
            build/release/SHA256SUMS
          compression-level: 0
          retention-days: 7
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/release/soundcore-actions-signed.apk build/release/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" build/release/soundcore-actions-signed.apk build/release/SHA256SUMS --verify-tag --title "Soundcore Actions $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/soundcore-signing.keystore"
